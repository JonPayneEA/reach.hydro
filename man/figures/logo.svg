<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 181 209" width="181" height="209">
  <defs>

    <!-- Deep black background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020810"/>
      <stop offset="50%" style="stop-color:#040d18"/>
      <stop offset="100%" style="stop-color:#010609"/>
    </linearGradient>

    <!-- Neon cyan river gradient -->
    <linearGradient id="riverCore" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f5ff"/>
      <stop offset="40%" style="stop-color:#00cfff"/>
      <stop offset="70%" style="stop-color:#00eeff"/>
      <stop offset="100%" style="stop-color:#00b8ff"/>
    </linearGradient>

    <!-- Oxbow neon fill -->
    <radialGradient id="oxbowGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#00eeff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#0044aa;stop-opacity:0.2"/>
    </radialGradient>

    <!-- Grid line gradient -->
    <linearGradient id="gridFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00aaff;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#00aaff;stop-opacity:0.03"/>
    </linearGradient>

    <!-- Terrain neon edge gradient -->
    <linearGradient id="terrainEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#004466"/>
      <stop offset="100%" style="stop-color:#001a33"/>
    </linearGradient>

    <!-- Strong neon glow for river -->
    <filter id="neonGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft neon glow for terrain edges -->
    <filter id="edgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>


    <!-- Hex clip -->
    <clipPath id="hexClip">
      <polygon points="90.5,5 175,52.5 175,156.5 90.5,204 6,156.5 6,52.5"/>
    </clipPath>

    <!-- Scanline pattern -->
    <pattern id="scanlines" x="0" y="0" width="181" height="3" patternUnits="userSpaceOnUse">
      <rect width="181" height="1" fill="#00ccff" opacity="0.025"/>
      <rect y="1" width="181" height="2" fill="transparent"/>
    </pattern>

    <!-- Grid pattern -->
    <pattern id="gridPattern" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#00aaff" stroke-width="0.3" opacity="0.18"/>
    </pattern>

  </defs>

  <!-- Hex outer glow ring -->
  <polygon points="90.5,2 178,51 178,158 90.5,207 3,158 3,51"
           fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.4" filter="url(#edgeGlow)"/>

  <!-- Main hex background -->
  <polygon points="90.5,5 175,52.5 175,156.5 90.5,204 6,156.5 6,52.5"
           fill="url(#bgGrad)"/>

  <g clip-path="url(#hexClip)">

    <!-- =====================================================
         TRON GRID — perspective grid receding to horizon
    ====================================================== -->

    <!-- Grid fill -->
    <rect x="0" y="0" width="181" height="209" fill="url(#gridPattern)" opacity="1"/>

    <!-- Horizontal grid lines with perspective convergence -->
    <line x1="0" y1="30"  x2="181" y2="30"  stroke="#00aaff" stroke-width="0.25" opacity="0.15"/>
    <line x1="0" y1="50"  x2="181" y2="50"  stroke="#00aaff" stroke-width="0.25" opacity="0.13"/>
    <line x1="0" y1="72"  x2="181" y2="72"  stroke="#00aaff" stroke-width="0.25" opacity="0.12"/>
    <line x1="0" y1="96"  x2="181" y2="96"  stroke="#00aaff" stroke-width="0.3"  opacity="0.14"/>
    <line x1="0" y1="122" x2="181" y2="122" stroke="#00aaff" stroke-width="0.25" opacity="0.12"/>
    <line x1="0" y1="150" x2="181" y2="150" stroke="#00aaff" stroke-width="0.25" opacity="0.11"/>
    <line x1="0" y1="180" x2="181" y2="180" stroke="#00aaff" stroke-width="0.25" opacity="0.10"/>

    <!-- =====================================================
         TERRAIN BLOCKS — dark flat-topped mesa shapes with
         glowing neon edges (Tron-style)
    ====================================================== -->

    <!-- Upper left terrain slab -->
    <path d="M 6 52 L 90.5 5 L 175 52.5 L 175 72
             C 155 68, 135 62, 112 56
             C 92 50, 78 38, 58 30
             C 40 23, 20 36, 6 52 Z"
          fill="#020f1a" stroke="none"/>
    <!-- Neon edge of upper terrain -->
    <path d="M 20 48 C 38 32, 60 28, 80 38 C 98 47, 108 54, 128 60 C 148 66, 162 70, 175 72"
          fill="none" stroke="#00ccff" stroke-width="0.8" opacity="0.5" filter="url(#edgeGlow)"/>
    <path d="M 6 52 C 14 44, 20 48, 20 48"
          fill="none" stroke="#00ccff" stroke-width="0.8" opacity="0.4"/>

    <!-- Upper right terrain slab -->
    <path d="M 104 22 L 150 24 L 175 52.5 L 175 58
             C 162 56, 148 58, 136 64
             C 124 70, 116 78, 106 76
             C 96 74, 90 66, 92 58
             Z"
          fill="#010c15" stroke="none"/>
    <path d="M 104 22 L 150 24 L 175 54 L 175 58 C 162 56, 148 58, 136 64 C 122 71, 110 76, 100 74 C 92 72, 88 64, 92 56 Z"
          fill="none" stroke="#00ccff" stroke-width="0.6" opacity="0.4" filter="url(#edgeGlow)"/>

    <!-- Left mid terrain (inside meander loop) -->
    <path d="M 6 90 C 16 86, 32 82, 46 88
             C 58 93, 64 106, 58 120
             C 52 134, 34 140, 18 136
             C 8 132, 6 122, 6 110 Z"
          fill="#010e18" stroke="none"/>
    <!-- Glowing edge -->
    <path d="M 14 90 C 28 84, 44 86, 54 96 C 62 104, 60 118, 50 126 C 40 134, 24 136, 14 128"
          fill="none" stroke="#00ccff" stroke-width="0.7" opacity="0.45" filter="url(#edgeGlow)"/>

    <!-- Right mid terrain (inside meander loop) -->
    <path d="M 175 110 C 164 108, 148 114, 140 126
             C 132 138, 136 152, 150 158
             C 163 164, 175 158, 175 156 Z"
          fill="#010e18" stroke="none"/>
    <path d="M 172 112 C 160 110, 146 116, 138 128 C 130 140, 134 154, 148 160"
          fill="none" stroke="#00ccff" stroke-width="0.7" opacity="0.45" filter="url(#edgeGlow)"/>

    <!-- Lower terrain slab -->
    <path d="M 6 156 L 6 140 C 18 144, 34 150, 50 160
             C 62 167, 70 176, 82 180
             C 92 183, 102 182, 114 178
             C 128 173, 136 162, 152 167
             C 164 172, 172 180, 175 186
             L 175 156.5 L 90.5 204 Z"
          fill="#020f1a" stroke="none"/>
    <path d="M 6 142 C 20 146, 36 152, 52 162 C 64 169, 72 177, 84 181 C 96 185, 108 183, 120 178 C 134 172, 140 163, 156 168 C 166 173, 174 181, 175 186"
          fill="none" stroke="#00ccff" stroke-width="0.7" opacity="0.4" filter="url(#edgeGlow)"/>

    <!-- =====================================================
         OXBOW LAKES — neon glowing pools
    ====================================================== -->

    <!-- Oxbow left -->
    <path d="M 24 72 C 14 66, 10 56, 18 52 C 26 48, 40 54, 42 64 C 44 74, 34 80, 24 72 Z"
          fill="#001a2e" stroke="#00eeff" stroke-width="0.8" opacity="0.8" filter="url(#edgeGlow)"/>
    <path d="M 26 66 C 20 62, 18 57, 24 56 C 30 55, 36 60, 34 66 C 32 72, 28 70, 26 66 Z"
          fill="#00ccff" opacity="0.2"/>
    <!-- Oxbow glow dot -->
    <circle cx="28" cy="64" r="2.5" fill="#00eeff" opacity="0.35" filter="url(#neonGlow)"/>

    <!-- Oxbow right -->
    <path d="M 152 136 C 162 130, 168 138, 164 148 C 160 158, 148 160, 142 152 C 136 144, 142 142, 152 136 Z"
          fill="#001a2e" stroke="#00eeff" stroke-width="0.8" opacity="0.8" filter="url(#edgeGlow)"/>
    <path d="M 152 140 C 158 136, 162 141, 159 148 C 156 155, 148 156, 145 150 C 142 144, 146 144, 152 140 Z"
          fill="#00ccff" opacity="0.18"/>
    <circle cx="153" cy="148" r="2" fill="#00eeff" opacity="0.3" filter="url(#neonGlow)"/>

    <!-- =====================================================
         MAIN MEANDER RIVER — Tron neon light-cycle style
         Layered for deep neon bloom effect
    ====================================================== -->

    <!-- Outermost diffuse bloom -->
    <path d="
      M -5 40
      C 15 36, 45 28, 68 40
      C 90 52, 88 70, 106 80
      C 124 90, 155 84, 168 98
      C 180 112, 170 130, 152 136
      C 134 142, 108 130, 92 142
      C 76 154, 74 170, 55 178
      C 40 184, 15 182, -5 180
    " fill="none" stroke="#00ccff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity="0.04"/>

    <!-- Wide outer glow -->
    <path d="
      M -5 40
      C 15 36, 45 28, 68 40
      C 90 52, 88 70, 106 80
      C 124 90, 155 84, 168 98
      C 180 112, 170 130, 152 136
      C 134 142, 108 130, 92 142
      C 76 154, 74 170, 55 178
      C 40 184, 15 182, -5 180
    " fill="none" stroke="#00ddff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.08"/>

    <!-- Mid glow -->
    <path d="
      M -5 40
      C 15 36, 45 28, 68 40
      C 90 52, 88 70, 106 80
      C 124 90, 155 84, 168 98
      C 180 112, 170 130, 152 136
      C 134 142, 108 130, 92 142
      C 76 154, 74 170, 55 178
      C 40 184, 15 182, -5 180
    " fill="none" stroke="#00eeff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.18"/>

    <!-- River dark body (channel water) -->
    <path d="
      M -5 40
      C 15 36, 45 28, 68 40
      C 90 52, 88 70, 106 80
      C 124 90, 155 84, 168 98
      C 180 112, 170 130, 152 136
      C 134 142, 108 130, 92 142
      C 76 154, 74 170, 55 178
      C 40 184, 15 182, -5 180
    " fill="none" stroke="#001828" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- River neon edge lines — the key Tron light-cycle look -->
    <path d="
      M -5 40
      C 15 36, 45 28, 68 40
      C 90 52, 88 70, 106 80
      C 124 90, 155 84, 168 98
      C 180 112, 170 130, 152 136
      C 134 142, 108 130, 92 142
      C 76 154, 74 170, 55 178
      C 40 184, 15 182, -5 180
    " fill="none" stroke="#00f5ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
       filter="url(#neonGlow)" opacity="0.9"/>

    <!-- Brightest inner core line -->
    <path d="
      M -5 40
      C 15 36, 45 28, 68 40
      C 90 52, 88 70, 106 80
      C 124 90, 155 84, 168 98
      C 180 112, 170 130, 152 136
      C 134 142, 108 130, 92 142
      C 76 154, 74 170, 55 178
      C 40 184, 15 182, -5 180
    " fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

    <!-- Bank edges — sharp neon outline each side of river -->
    <!-- Left bank -->
    <path d="
      M -5 32
      C 14 28, 44 20, 64 33
      C 82 44, 80 64, 98 74
      C 116 84, 148 78, 162 92
      C 173 104, 163 124, 146 130
      C 130 136, 106 124, 90 136
      C 74 148, 70 165, 50 173
      C 36 179, 12 178, -5 172
    " fill="none" stroke="#00ccff" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

    <!-- Right bank -->
    <path d="
      M -5 48
      C 17 44, 46 37, 72 48
      C 96 59, 96 76, 114 86
      C 132 96, 162 90, 174 104
      C 184 117, 175 136, 158 142
      C 141 148, 114 136, 96 148
      C 80 160, 78 175, 60 183
      C 45 189, 19 186, -5 188
    " fill="none" stroke="#00ccff" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

    <!-- =====================================================
         FLOW DIRECTION ARROWS — chevrons along river
    ====================================================== -->

    <!-- Arrow 1 ~upper section -->
    <path d="M 46 35 L 50 38 L 46 41" fill="none" stroke="#00eeff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

    <!-- Arrow 2 ~mid upper -->
    <path d="M 98 73 L 102 77 L 98 81" fill="none" stroke="#00eeff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"
          transform="rotate(25, 100, 77)"/>

    <!-- Arrow 3 ~right bend -->
    <path d="M 158 98 L 162 102 L 158 106" fill="none" stroke="#00eeff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"
          transform="rotate(80, 160, 102)"/>

    <!-- Arrow 4 ~lower left -->
    <path d="M 76 156 L 72 160 L 76 164" fill="none" stroke="#00eeff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"
          transform="rotate(-30, 74, 160)"/>

    <!-- =====================================================
         POINT BARS — neon-tinted sandy deposits
    ====================================================== -->
    <path d="M 55 30 C 62 28, 70 30, 72 36 C 74 42, 68 48, 60 46 C 52 44, 48 38, 55 30 Z"
          fill="#003344" stroke="#00aacc" stroke-width="0.5" opacity="0.5"/>
    <path d="M 128 94 C 136 90, 146 90, 150 98 C 154 106, 146 114, 138 110 C 130 106, 124 100, 128 94 Z"
          fill="#003344" stroke="#00aacc" stroke-width="0.5" opacity="0.45"/>

    <!-- =====================================================
         SCANLINES overlay
    ====================================================== -->
    <rect x="0" y="0" width="181" height="209" fill="url(#scanlines)"/>

    <!-- =====================================================
         NEON SPARKLE NODES at key junctions/headwaters
    ====================================================== -->
    <circle cx="42" cy="34" r="2.5" fill="#00eeff" opacity="0.9" filter="url(#neonGlow)"/>
    <circle cx="108" cy="79" r="2" fill="#00eeff" opacity="0.8" filter="url(#neonGlow)"/>
    <circle cx="165" cy="100" r="2" fill="#00eeff" opacity="0.75" filter="url(#neonGlow)"/>
    <circle cx="148" cy="136" r="2" fill="#00eeff" opacity="0.8" filter="url(#neonGlow)"/>
    <circle cx="90" cy="142" r="2" fill="#00eeff" opacity="0.75" filter="url(#neonGlow)"/>
    <circle cx="54" cy="176" r="2.5" fill="#00eeff" opacity="0.8" filter="url(#neonGlow)"/>

    <!-- Small satellite dots -->
    <circle cx="26" cy="42" r="1.2" fill="#00ddff" opacity="0.5"/>
    <circle cx="80" cy="58" r="1" fill="#00ddff" opacity="0.45"/>
    <circle cx="138" cy="88" r="1" fill="#00ddff" opacity="0.45"/>
    <circle cx="170" cy="115" r="1" fill="#00ddff" opacity="0.4"/>
    <circle cx="124" cy="148" r="1" fill="#00ddff" opacity="0.4"/>
    <circle cx="68" cy="168" r="1.2" fill="#00ddff" opacity="0.45"/>

  </g>

  <!-- =====================================================
       HEX BORDER — neon Tron frame
  ====================================================== -->
  <!-- Outer glow -->
  <polygon points="90.5,5 175,52.5 175,156.5 90.5,204 6,156.5 6,52.5"
           fill="none" stroke="#00eeff" stroke-width="5" opacity="0.2" filter="url(#edgeGlow)"/>
  <!-- Main border -->
  <polygon points="90.5,5 175,52.5 175,156.5 90.5,204 6,156.5 6,52.5"
           fill="none" stroke="#00eeff" stroke-width="2.2" opacity="0.95"/>
  <!-- Inner bevel -->
  <polygon points="90.5,9 171,54.5 171,154.5 90.5,200 10,154.5 10,54.5"
           fill="none" stroke="#00aacc" stroke-width="0.6" opacity="0.35"/>

  <!-- =====================================================
       TEXT — "reach" in cyan, ".hydro" in orange
       Single text element with tspan for reliable centring
  ====================================================== -->

  <!-- Two-colour centred text -->
  <text x="90.5" y="110"
        font-family="'Courier New', 'Lucida Console', monospace"
        font-size="15"
        font-weight="bold"
        letter-spacing="1"
        text-anchor="middle"
        text-decoration="none">
    <tspan fill="#00eeff">reach</tspan><tspan fill="#ff8c00">.hydro</tspan>
  </text>

</svg>
